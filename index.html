<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restoran Car | Odžaci</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
    line-height: 1.6;
}

header {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(13,13,13,0.95);
    border-bottom: 1px solid #333;
}

.navbar {
    max-width: 1100px;
    margin: auto;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #d4af37;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 22px;
    font-size: 14px;
}

nav a:hover {
    color: #d4af37;
}

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 20px 70px;
    background:
        linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.88)),
        radial-gradient(circle at center, #3b3020, #0d0d0d 65%);
}

.hero-content {
    max-width: 800px;
}

.small-title {
    color: #d4af37;
    letter-spacing: 4px;
    font-size: 14px;
    text-transform: uppercase;
}

.hero h1 {
    font-size: clamp(50px, 12vw, 100px);
    margin: 10px 0;
    letter-spacing: 5px;
}

.hero h1 span {
    color: #d4af37;
}

.hero p {
    color: #ddd;
    font-size: 20px;
    margin-bottom: 30px;
}

.rating {
    font-size: 18px;
    margin-bottom: 30px;
}

.stars {
    color: #d4af37;
    letter-spacing: 4px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    padding: 14px 25px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    transition: .3s;
}

.btn-gold {
    background: #d4af37;
    color: #111;
}

.btn-gold:hover {
    transform: translateY(-3px);
}

.btn-outline {
    border: 1px solid #d4af37;
    color: #d4af37;
}

.btn-outline:hover {
    background: #d4af37;
    color: #111;
}

section {
    max-width: 1100px;
    margin: auto;
    padding: 90px 25px;
}

.section-title {
    text-align: center;
    margin-bottom: 50px;
}

.section-title span {
    color: #d4af37;
    font-size: 14px;
    letter-spacing: 3px;
}

.section-title h2 {
    font-size: 40px;
    margin-top: 8px;
}

.about {
    text-align: center;
    max-width: 800px;
    margin: auto;
}

.about p {
    color: #bbb;
    font-size: 18px;
}

.features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 45px;
}

.feature {
    background: #171717;
    border: 1px solid #292929;
    border-radius: 15px;
    padding: 30px 20px;
    text-align: center;
}

.feature .icon {
    font-size: 35px;
    margin-bottom: 12px;
}

.feature h3 {
    margin-bottom: 8px;
}

.feature p {
    color: #999;
    font-size: 14px;
}

.menu-box {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.menu-item {
    background: #171717;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #292929;
}

.menu-item h3 {
    color: #d4af37;
    margin-bottom: 8px;
}

.menu-item p {
    color: #aaa;
}

.menu-note {
    text-align: center;
    color: #888;
    margin-top: 30px;
}

.contact {
    background: #151515;
    max-width: 100%;
}

.contact-inner {
    max-width: 900px;
    margin: auto;
    text-align: center;
}

.contact-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 40px;
}

.contact-card {
    padding: 25px;
    background: #202020;
    border-radius: 15px;
}

.contact-card .icon {
    font-size: 30px;
    margin-bottom: 10px;
}

.contact-card h3 {
    color: #d4af37;
    margin-bottom: 8px;
}

.contact-card p,
.contact-card a {
    color: #ccc;
    text-decoration: none;
}

.instagram {
    margin-top: 40px;
}

.instagram a {
    color: #d4af37;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px 20px;
    background: #090909;
    color: #777;
    font-size: 14px;
}

@media (max-width: 750px) {

    nav {
        display: none;
    }

    .hero h1 {
        font-size: 58px;
    }

    .hero p {
        font-size: 17px;
    }

    .features,
    .menu-box,
    .contact-grid {
        grid-template-columns: 1fr;
    }

    section {
        padding: 70px 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="navbar">
        <div class="logo">RESTORAN <span>CAR</span></div>

        <nav>
            <a href="#pocetna">Početna</a>
            <a href="#o-nama">O nama</a>
            <a href="#meni">M
